# SECURITY RESEARCH CONFIGURATION
# Purpose: Traffic Filtering & Reverse Proxy with Bot Detection
# Author: Sebastian Aguilar

# Define logical block for bot detection based on User-Agent
map $http_user_agent $is_suspicious_traffic {
    default 0;
    # Security Scanners & Bots
    ~*(virustotal|zscaler|paloalto|fireeye|crowdstrike|fortinet) 1;
    ~*(nikto|nmap|sqlmap|wpscan|python|go-http-client) 1;
    # Search Engine Crawlers (Optional - strictly for stealth labs)
    ~*(googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot) 1;
}

server {
    listen 80;
    server_name research-lab.online; # Generic Placeholder

    # ---------------------------------------------------------
    # LAYER 1: WAF / Traffic Filtering
    # ---------------------------------------------------------
    if ($is_suspicious_traffic) {
        # Redirect suspicious automated traffic to a benign site (Cloaking)
        return 301 https://es.wikipedia.org/wiki/Seguridad_informática;
    }

    # ---------------------------------------------------------
    # LAYER 2: Public Facing Content (Legitimate Appearance)
    # ---------------------------------------------------------
    location / {
        root /var/www/html/landing-legitima;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ---------------------------------------------------------
    # LAYER 3: Internal Lab Access (Reverse Proxy)
    # ---------------------------------------------------------
    # Only accessible via specific interaction flows
    location /research-panel {
        proxy_pass http://127.0.0.1:8080; # Internal Backend
        
        # Proxy Headers for Real IP Forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Security Headers
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
    }
}
