# SECURITY RESEARCH CONFIGURATION
# Purpose: Traffic Filtering & Reverse Proxy with Bot Detection (Cloaking)
# Author: Sebastian Aguilar

# Define logical block for bot detection based on User-Agent in nginx.conf
map $http_user_agent $is_suspicious_traffic {
    default 0;
    # Security Scanners & Cybersecurity Companies
    ~*(virustotal|zscaler|paloalto|fireeye|crowdstrike|fortinet) 1;
    ~*(nikto|nmap|sqlmap|wpscan|python|go-http-client) 1;
    # Search Engine Crawlers (Detection Evasion)
    ~*(googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot) 1;
}

server {
    listen 80;
    server_name dominio-servicios.com; 

    # ---------------------------------------------------------
    # LAYER 1: WAF / Cloaking (Bot Redirect)
    # ---------------------------------------------------------
    if ($is_suspicious_traffic) {
        # Redirect automated scanners to a benign resource
        return 301 https://es.wikipedia.org/wiki/Servicios_de_red;
    }

    # Redirect legitimate human traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dominio-servicios.com;

    ssl_certificate /etc/letsencrypt/live/dominio-servicios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dominio-servicios.com/privkey.pem;

    # ---------------------------------------------------------
    # LAYER 2: Public Facing Content (Aging/Decoy)
    # ---------------------------------------------------------
    location / {
        root /var/www/servicios/html;
        index index.html;
        # Ensure that non-existing files return 404 to avoid path discovery
        try_files $uri $uri/ =404;
    }

    # ---------------------------------------------------------
    # LAYER 3: Internal Lab Access (Reverse Proxy)
    # ---------------------------------------------------------
    # Path Masking: Only requests starting with /s/ are forwarded to the C2
    location /s/ {
        proxy_pass http://127.0.0.1:8080; 
        
        # Proxy Headers for real identity and protocol forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable redirects from the backend that could leak internal ports
        proxy_redirect off;
    }
}
